version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: '06:30'
      timezone: Europe/London
    allow:
      - dependency-name: 'capell-app/*'
    groups:
      capell-release:
        patterns:
          - 'capell-app/*'
    versioning-strategy: increase
    open-pull-requests-limit: 3
