name: Released Capell canary
on:
  schedule:
    - cron: '17 6 * * *'
  repository_dispatch:
    types: [capell-release]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: capell-release-canary
  cancel-in-progress: false
jobs:
  latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, exif, gd, zip
          coverage: none
      - run: php scripts/pin-capell-release.php --write
      - run: composer update --no-interaction --prefer-dist
      - run: composer run setup
      - run: vendor/bin/pest --ci
      - name: Propose verified release pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- composer.json composer.lock; then exit 0; fi
          branch="automation/capell-release-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'Capell release maintenance'
          git config user.email 'capell.app26@gmail.com'
          git add composer.json composer.lock
          git commit -m 'chore: verify starter kit against released Capell'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Update verified Capell release pins' --body 'The release canary installed the latest stable packages from Packagist and passed every example test before proposing these exact pins.'
