name: Published starter smoke
on:
  pull_request:
    paths:
      - .github/workflows/distribution.yml
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'
  repository_dispatch:
    types: [capell-release]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, exif, gd, zip
          coverage: none
      - name: Install the published starter through Laravel
        run: |
          composer global require laravel/installer --no-interaction --prefer-dist
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          git archive --format=tar HEAD | tar -t | grep -Fx '.github/workflows/tests.yml'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The PR proves the candidate; scheduled/manual runs prove Packagist.
            git branch --force main HEAD
            composer config --global repositories.starter-kit vcs "$GITHUB_WORKSPACE"
          fi
          mkdir -p "$RUNNER_TEMP/starter-consumer"
          cd "$RUNNER_TEMP/starter-consumer"
          mkdir -p "$RUNNER_TEMP/distribution-evidence"
          laravel new x --using=capell-app/starter-kit --pest --no-boost --no-interaction 2>&1 | tee "$RUNNER_TEMP/distribution-evidence/install.log"
          if grep -E "PHP (Warning|Fatal error):" "$RUNNER_TEMP/distribution-evidence/install.log"; then exit 1; fi
          cd x
          vendor/bin/pest --ci
          php artisan capell:doctor --no-interaction
      - name: Prepare the browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-save playwright@1.65.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prove the site and authenticated Admin
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/distribution-evidence
          APPDIR: ${{ runner.temp }}/starter-consumer/x
          BROWSER_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cd "$APPDIR"
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/starter-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';
          const { chromium } = await import(process.env.BROWSER_MODULE);
          const base = 'http://localhost:8000';
          let ready = false;
          for (let attempt = 0; attempt < 40; attempt++) {
            try { ready = (await fetch(`${base}/up`)).ok; } catch {}
            if (ready) break;
            await setTimeout(250);
          }
          assert(ready, 'artisan serve must become ready');
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          try {
            assert.equal((await page.goto(base)).status(), 200);
            assert.equal(await page.locator('main h1').count(), 1);
            assert.equal(await page.locator('body').evaluate(el => getComputedStyle(el).backgroundColor), 'rgb(243, 240, 232)');
            await page.screenshot({ path: `${process.env.EVIDENCE_DIR}/site.png`, fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), true);
            await page.screenshot({ path: `${process.env.EVIDENCE_DIR}/mobile.png`, fullPage: true });
            await page.setViewportSize({ width: 1440, height: 1000 });
            assert.equal((await page.goto(`${base}/contact`)).status(), 200);
            assert.equal(await page.locator('form input[name="email"]').count(), 1);
            await page.screenshot({ path: `${process.env.EVIDENCE_DIR}/contact.png`, fullPage: true });
            assert.equal((await page.goto(`${base}/admin/login`)).status(), 200);
            await page.locator('input[type="email"]').fill('admin@example.test');
            const password = await readFile(`${process.env.APPDIR}/storage/app/private/starter-admin-password`, 'utf8');
            await page.locator('input[type="password"]').fill(password);
            await page.getByRole('button', { name: 'Sign in', exact: true }).click();
            await page.waitForURL(`${base}/admin`);
            await page.getByText('Studio settings', { exact: true }).waitFor();
            assert.equal(await page.locator('#studio-name').inputValue(), 'North Studio');
            await page.screenshot({ path: `${process.env.EVIDENCE_DIR}/admin.png`, fullPage: true });
            assert.deepEqual(errors, [], 'pages must not raise browser exceptions');
            await writeFile(`${process.env.EVIDENCE_DIR}/result.json`, JSON.stringify({ command: 'laravel new x --using=capell-app/starter-kit', server: 'php artisan serve', site: 200, contact: 200, authenticatedAdmin: true, mobileOverflow: false, browserErrors: errors }, null, 2));
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: distribution-evidence
          path: ${{ runner.temp }}/distribution-evidence
          if-no-files-found: error
